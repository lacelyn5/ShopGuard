[pytest]
addopts = -ra -m unit
markers =
    unit: fast isolated tests without internet or browser
    api: hits the public practice store API
    ui: launches a browser against the public practice store UI
    auth: uses shared public demonstration account without changing profile
    stateful: creates or changes test data on a public shared service; explicitly opt in
    smoke: small critical subset of live tests
    regression: broader live regression checks
    explore: potentially volatile exploratory checks
    target_ui: generic read-only browser smoke test for a saved dashboard target
    target_api: generic read-only API GET check for a saved dashboard target
filterwarnings =
    ignore:.*urllib3.*:DeprecationWarning
